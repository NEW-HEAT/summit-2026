<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      #handoff-frame,
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 1920px;
        height: 1080px;
      }

      #handoff-frame {
        object-fit: fill;
        pointer-events: none;
      }

      #timecode-overlay {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="handoff-frame" alt="" />
    <canvas id="scene" width="1920" height="1080"></canvas>
    <canvas id="timecode-overlay" width="1920" height="1080"></canvas>
    <script type="module" src="./living-ladder-scene.mjs"></script>
  </body>
</html>
