<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Personal contribution location globe</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #stage, #globe-canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      body { position: fixed; inset: 0; }
      #stage, #globe-canvas { position: absolute; inset: 0; }
      #globe-canvas { display: block; }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Transparent contribution location globe">
      <canvas id="globe-canvas" width="1920" height="1080"></canvas>
    </main>
    <script type="module" src="./globe-scene.ts"></script>
  </body>
</html>
