<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical deck.gl contribution calendar render</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; }
      .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay-canvas { pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="deck-canvas" width="1920" height="1080"></canvas>
      <canvas id="overlay-canvas" width="1920" height="1080"></canvas>
    </div>
    <script type="module" src="/scene/vertical-scene.ts"></script>
  </body>
</html>
