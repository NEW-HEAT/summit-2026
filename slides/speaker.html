<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100e">
  <title>NEWHEAT · Speaker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/speaker.css">
</head>
<body>
  <header>
    <div class="masthead"><span class="brand">NEW HEAT</span><span id="connection" role="status">Connecting…</span></div>
    <div class="toolbar">
      <label class="sr-only" for="slide-picker">Jump to slide notes</label><select id="slide-picker" aria-label="Jump to slide notes"><option>Loading slides…</option></select>
      <button id="smaller" aria-label="Smaller text">A−</button><button id="larger" aria-label="Larger text">A+</button>
    </div>
    <div class="reading-controls"><div class="modes" aria-label="Script display"><button id="cues" aria-pressed="true">Cues</button><button id="full" aria-pressed="false">Full script</button></div><button id="follow" hidden>Return to live</button><span id="following">Following stage</span></div>
  </header>
  <main id="script">
    <p id="cue-number" class="eyebrow"></p><h1 id="cue-title">Your speaker notes</h1><p id="build" class="eyebrow" hidden></p>
    <div id="words"><p class="empty">Waiting for the show…</p></div>
  </main>
  <footer><button id="previous" disabled aria-label="Previous notes">← Previous</button><span id="position"></span><button id="next" disabled aria-label="Next notes">Next →</button></footer>
  <script type="module" src="/speaker.js"></script>
</body>
</html>
