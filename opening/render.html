        const clamp = (value, low = 0, high = 1) =>

        const easeInOutSine = (value) => -(Math.cos(Math.PI * value) - 1) / 2;
        const easeInOutCubic = (value) =>

        function hexToRgb(hex) {
          return {

            g: Number.parseInt(hex.slice(3, 5), 16),

          const {r, g, b} = hexToRgb(hex);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function mixHex(from, to, amount) {
          const a = hexToRgb(from);
          const b = hexToRgb(to);
          const channel = (start, end) =>
            Math.round(mix(start, end, clamp(amount))).toString(16).padStart(2, '0');
          return `#${channel(a.r, b.r)}${channel(a.g, b.g)}${channel(a.b, b.b)}`;
        }

        function tripRouteTheme(routeIndex, variant = 0) {
          return TRIP_ROUTE_THEMES[
            (routeIndex * 3 + variant * 2) % TRIP_ROUTE_THEMES.length
          ];
        }

        function tripRouteRgb(routeIndex, variant, timeSeconds, opening = false) {
          const theme = tripRouteTheme(routeIndex, variant);
          const warm = (routeIndex + variant) % 2 === 0 ? '#ff761b' : '#ed2f16';
          const coolIn = opening ? smoothstep(1.35, 3.55, timeSeconds) : 1;
          const color = hexToRgb(mixHex(warm, theme.middle, coolIn));
          return [color.r, color.g, color.b];
        }

        function referenceSampleIndex(pointIndex) {
          const row = Math.floor(pointIndex / 10);
          const column = pointIndex % 10;
          if (row < 3) return pointIndex;
          const sourceRow = row - 2;
          const shiftedColumn = (column + row * 3) % 10;
          return sourceRow * 10 + shiftedColumn;
        }

        function blendHexColors(colors, weights) {
          const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
          const channels = colors.reduce((totals, color, index) => {
            const rgb = hexToRgb(color);
            const weight = weights[index] / totalWeight;
            totals.r += rgb.r * weight;
            totals.g += rgb.g * weight;
            totals.b += rgb.b * weight;
            return totals;
          }, {r: 0, g: 0, b: 0});
          return `#${[channels.r, channels.g, channels.b]
            .map((channel) => Math.round(channel).toString(16).padStart(2, '0'))
            .join('')}`;
        }

        function setColorLightness(hex, targetLightness, chromaScale = 1) {
          const source = hexToRgb(hex);
          const channels = [source.r, source.g, source.b].map((channel) => channel / 255);
          const maximum = Math.max(...channels);
          const minimum = Math.min(...channels);
          const range = maximum - minimum;
          let hue = 0;
          if (range > 0) {
            if (maximum === channels[0]) hue = ((channels[1] - channels[2]) / range) % 6;
            else if (maximum === channels[1]) hue = (channels[2] - channels[0]) / range + 2;
            else hue = (channels[0] - channels[1]) / range + 4;
            hue /= 6;
            if (hue < 0) hue += 1;
          }
          const chroma = Math.min(
            range * chromaScale,
            1 - Math.abs(2 * targetLightness - 1)
          );
          const section = hue * 6;
          const secondary = chroma * (1 - Math.abs((section % 2) - 1));
          let converted;
          if (section < 1) converted = [chroma, secondary, 0];
          else if (section < 2) converted = [secondary, chroma, 0];
          else if (section < 3) converted = [0, chroma, secondary];
          else if (section < 4) converted = [0, secondary, chroma];
          else if (section < 5) converted = [secondary, 0, chroma];
          else converted = [chroma, 0, secondary];
          const match = targetLightness - chroma / 2;
          return `#${converted
            .map((channel) => Math.round((channel + match) * 255).toString(16).padStart(2, '0'))
            .join('')}`;
        }

        function referenceSpatialColor(pointIndex) {
          const row = Math.floor(pointIndex / 10);
          const column = pointIndex % 10;
          const neighborIndices = [
            pointIndex,
            row * 10 + Math.max(0, column - 1),
            row * 10 + Math.min(9, column + 1),
            Math.max(0, row - 1) * 10 + column,
            Math.min(4, row + 1) * 10 + column

          return blendHexColors(
            neighborIndices.map((index) => REFERENCE_CUT_COLOR_FRAME[referenceSampleIndex(index)]),
            [0.88, 0.03, 0.03, 0.03, 0.03]
          );

        function referenceOrbTheme(pointIndex, timeSeconds) {
          const baseColor = DAFT_REFERENCE_ORB_BASE_COLORS[pointIndex];
          const danceColor = DAFT_REFERENCE_ORB_BASE_COLORS[

          const baseRgb = hexToRgb(baseColor);
          const greenBias = clamp((baseRgb.g - baseRgb.b + 24) / 144);
          const pulse = (Math.sin((timeSeconds - TIMING.pointTransitionStart) * 1.7 + pointIndex * 0.41) + 1) * 0.5;
          const blueLedBase = mixHex(
            baseColor,
            '#07509f',
            0.12 + greenBias * 0.28
          );
          const dancingBase = mixHex(blueLedBase, danceColor, pulse * 0.075);
          const baseTheme = {
            colorStart: setColorLightness(
              dancingBase,
              mix(0.43, 0.375, greenBias),
              0.88
            ),
            colorMiddle: setColorLightness(
              mixHex(baseColor, '#052f70', 0.36 + greenBias * 0.18),
              0.235,
              0.9
            ),
            colorHighlight: setColorLightness(
              mixHex(dancingBase, '#1592b5', 0.16 + greenBias * 0.16),
              mix(0.56, 0.5, greenBias),
              0.76

          const referenceSpot = DAFT_REFERENCE_SPOT_OVERRIDES[pointIndex];
          if (!referenceSpot) return baseTheme;
          const spotProgress = easeInOutSine(smoothstep(
            TIMING.referenceSpotFadeStart,
            TIMING.referenceSpotFadeEnd,

          const spotTheme = {
            colorStart: setColorLightness(
