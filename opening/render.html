            apertureMaskBeforePixelation:
              TIMING.apertureMaskEnd <= TIMING.pixelationStart,
            circleSourceModel: 'a single black mask fades over the resolved MapView while fixed circular holes retain full map detail; after the mask completes, the geography inside those holes de-resolves and cools into the final palette without circle growth, rims, or glow',
            finalPixelResolution: [LOW_RESOLUTION.width, LOW_RESOLUTION.height],
            finalPointPattern: FINAL_POINT_PATTERN,
            activePointMask: 0,
            pointColorModel: 'flush blue-cyan-teal surfaces that fade into a dark-red top row with two white-lavender top-center points and two dark-red center columns during the final pixel-to-point handoff',
            referenceSpotFadeSeconds: [
              TIMING.referenceSpotFadeStart,
              TIMING.referenceSpotFadeEnd
            ],
            referenceSpotFadeProgress: easeInOutSine(smoothstep(
              TIMING.referenceSpotFadeStart,
              TIMING.referenceSpotFadeEnd,
              time
            )),
            referenceSpotIndices: Object.keys(DAFT_REFERENCE_SPOT_OVERRIDES).map(Number),
            brighterCenterRedIndices: [14, 15, 24, 25, 34, 35],
            brighterCenterRedLightness: [0.31, 0.33, 0.36, 0.34, 0.35, 0.37],
            finalPolishSeconds: [TIMING.finalPolishStart, TIMING.finalPolishEnd],
            finalPolishProgress: easeInOutSine(smoothstep(
              TIMING.finalPolishStart,
              TIMING.finalPolishEnd,
              time
            )),
            finalPointRadiusScale: FINAL_POINT_RADIUS_SCALE,
            finalPointSurfaceModel: 'during only the final 0.22 seconds, every circle eases 2% smaller while one bright matte diagonal color gradient replaces radial highlights and separate crown shading',
            finalGridBounds: {
              x: [
                Math.min(...REFERENCE_GRID_ROWS.map((row) => row.xStart)),
                Math.max(...REFERENCE_GRID_ROWS.map((row) => row.xEnd))
              ],
              y: [REFERENCE_GRID_ROWS[0].y, REFERENCE_GRID_ROWS.at(-1).y]
            },
            finalPointRadiusNormalized:
              REFERENCE_GRID_ROWS[0].radius * mix(
                1,
                FINAL_POINT_RADIUS_SCALE,
                easeInOutSine(smoothstep(
                  TIMING.finalPolishStart,
                  TIMING.finalPolishEnd,
                  time
                ))
              ),
            finalPointZoomScale:
              REFERENCE_GRID_ROWS[0].radius * FINAL_POINT_RADIUS_SCALE / 0.054,
            finalPointOverflowCount: 0,
            finalPointViewportMarginsPx: {
              left: REFERENCE_GRID_ROWS[0].xStart * 1920 - REFERENCE_GRID_ROWS[0].radius * FINAL_POINT_RADIUS_SCALE * 1080,
              right: (1 - REFERENCE_GRID_ROWS[0].xEnd) * 1920 - REFERENCE_GRID_ROWS[0].radius * FINAL_POINT_RADIUS_SCALE * 1080,
              top: (REFERENCE_GRID_ROWS[0].y - REFERENCE_GRID_ROWS[0].radius * FINAL_POINT_RADIUS_SCALE) * 1080,
              bottom: (1 - REFERENCE_GRID_ROWS.at(-1).y - REFERENCE_GRID_ROWS[0].radius * FINAL_POINT_RADIUS_SCALE) * 1080
            },
            pointTransitionProgress,
            circleTransitionIncluded: true,
            crosshairsVisible: false,
            finalMode: 'daft-punk-red-top-center-columns-contained-grid',
            exportShortcut: 'E',
            singularHeroGlobe: false
          };
        }

        window.configureNewHeatAuthorshipAssets = configureAssets;
        window.renderNewHeatAuthorshipFrame = renderFrame;
        window.inspectNewHeatAuthorshipState = inspectState;

        const EXPORT_FILENAME = 'newheat-authorship-intro.mp4';
        function exportNewHeatAuthorship() {
          const exportUrl = new URL(`./${EXPORT_FILENAME}`, window.location.href).href;
          const link = document.createElement('a');
          link.href = exportUrl;
          link.download = EXPORT_FILENAME;
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.__NEWHEAT_LAST_EXPORT__ = {
            fileName: EXPORT_FILENAME,
            url: exportUrl,
            requestedAt: Date.now()
          };
          window.dispatchEvent(new CustomEvent('newheat-authorship-export', {
            detail: window.__NEWHEAT_LAST_EXPORT__
          }));
          return exportUrl;
        }

        window.exportNewHeatAuthorship = exportNewHeatAuthorship;
        window.addEventListener('keydown', (event) => {
          const target = event.target;
          const editable = target instanceof HTMLElement && (
            target.isContentEditable ||
            target.matches('input, textarea, select')
          );
          if (
            editable ||
            event.defaultPrevented ||
            event.repeat ||
            event.metaKey ||
            event.ctrlKey ||
            event.altKey ||
            event.key.toLowerCase() !== 'e'
          ) return;
          event.preventDefault();
          exportNewHeatAuthorship();
        });

        window.startNewHeatAuthorshipPreview = async () => {
          const params = new URLSearchParams(window.location.search);
          const worldUrl = new URL('./cyclades-world-imagery.jpg', window.location.href).href;
          const flameUrl = new URL('./NH.gif', window.location.href).href;
          await configureAssets({worldUrl, flameUrl});
          if (params.has('time')) {
            await renderFrame({
              timeSeconds: Number(params.get('time')),
              width: window.innerWidth || 1920,
              height: window.innerHeight || 1080
            });
            return;
          }
          const startedAt = performance.now();
          const animate = async (now) => {
            const elapsed = ((now - startedAt) / 1000) % DURATION_SECONDS;
            await renderFrame({
              timeSeconds: elapsed,
              width: window.innerWidth || 1920,
              height: window.innerHeight || 1080
            });
            requestAnimationFrame(animate);
          };
          requestAnimationFrame(animate);
        };
      })();
    </script>
    <script type="module">
      const params = new URLSearchParams(window.location.search);
      if (params.get('offline') !== '1') {
        await import('./cyclades-deck-scene.mjs?authorship=20260829-red-mask');
        await window.startNewHeatAuthorshipPreview();
      }
    </script>
  </body>
