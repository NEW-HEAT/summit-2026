<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>NEW HEAT · Fitness Globe Rewind</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #000;
        color: #f7f7f2;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #stage {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #world-imagery-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      #interactive-ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }
      html[data-ui="clean"] #interactive-ui {
        display: none;
      }
      #export-timestamp {
        display: none;
      }
      #timestamp-preview-canvas {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      html[data-ui="clean"][data-track="timestamp"] #timestamp-preview-canvas {
        display: block;
      }
      html[data-ui="clean"][data-track="timestamp"] #world-imagery-canvas {
        visibility: hidden;
      }
      .title-block {
        position: absolute;
        left: 28px;
        top: 24px;
        display: grid;
        gap: 4px;
        text-shadow: 0 2px 12px #000;
      }
      .eyebrow {
        color: #a8ffcf;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #rewind-date {
        margin: 0;
        font-size: clamp(32px, 4vw, 58px);
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      #rewind-beat {
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.12em;
      }
      .control-panel {
        position: absolute;
        left: 50%;
        bottom: 22px;
        width: min(780px, calc(100vw - 40px));
        transform: translateX(-50%);
        padding: 13px 14px 14px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        background: rgba(10, 12, 13, 0.78);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(20px) saturate(1.25);
        pointer-events: auto;
      }
      .control-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: center;
      }
      button {
        appearance: none;
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #play-toggle {
        min-width: 78px;
        height: 38px;
        padding: 0 18px;
        border-radius: 999px;
        background: #f4f5ef;
        color: #080909;
        font-size: 13px;
        font-weight: 720;
      }
      #frame-slider {
        width: 100%;
        accent-color: #79ffa9;
        cursor: ew-resize;
      }
      .meta-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        margin-top: 9px;
        align-items: end;
      }
      .sequence-meta {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      #rewind-window {
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      #rewind-zone,
      #archive-status {
        color: rgba(255, 255, 255, 0.52);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mode-switch {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      .mode-switch button {
        padding: 7px 10px;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font-size: 10px;
        letter-spacing: 0.04em;
      }
      .mode-switch button[data-selected="true"] {
        color: #07110b;
        background: #91ffb8;
      }
      .archive-pill {
        position: absolute;
        top: 25px;
        right: 28px;
        max-width: min(42vw, 430px);
        padding: 8px 11px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
      }
      @media (max-width: 640px) {
        .title-block {
          left: 18px;
          top: 18px;
        }
        .archive-pill {
          top: auto;
          bottom: 148px;
          left: 50%;
          right: auto;
          max-width: calc(100vw - 40px);
          transform: translateX(-50%);
        }
        .meta-row {
          grid-template-columns: 1fr;
        }
        .mode-switch {
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Fitness globe rewind stage">
      <canvas id="world-imagery-canvas"></canvas>
    </main>
    <canvas id="timestamp-preview-canvas" width="1920" height="1080"></canvas>
    <time id="export-timestamp" datetime="2026-09-06">SEP 06 2026</time>
    <section id="interactive-ui" aria-label="Rewind preview controls">
      <header class="title-block">
        <span class="eyebrow">NEW HEAT · LOCAL FITNESS REWIND</span>
        <h1 id="rewind-date">Loading archive</h1>
        <span id="rewind-beat">WORLD — / 32</span>
      </header>
      <div class="archive-pill">
        <span id="archive-status">Reading local archive…</span>
      </div>
      <div class="control-panel">
        <div class="control-row">
          <button id="play-toggle" type="button" aria-pressed="false">
            Play
          </button>
          <input
            id="frame-slider"
            type="range"
            min="0"
            max="1853"
            value="0"
            step="1"
            aria-label="Rewind frame"
          />
        </div>
        <div class="meta-row">
          <div class="sequence-meta">
            <span id="rewind-window">Selecting 32 geographic memories…</span>
            <span id="rewind-zone"
              >Preparing continuous camera flights between real activity
              clusters…</span
            >
          </div>
          <div class="mode-switch" aria-label="Untimed route treatment">
            <button
              type="button"
              data-untimed-mode="provenance"
              data-selected="true"
              aria-pressed="true"
            >
              PROVENANCE
            </button>
            <button
              type="button"
              data-untimed-mode="editorial"
              data-selected="false"
              aria-pressed="false"
            >
              EDITORIAL UNPAINT
            </button>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
